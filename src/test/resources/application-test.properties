# Configuração usada pelos testes (@ActiveProfiles("test")).
# Banco H2 EM MEMÓRIA: cada execução começa vazia, a migração da planilha roda e o seu
# banco de desenvolvimento (./database) não é tocado.
spring.datasource.url=jdbc:h2:mem:ezvestteste;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS APP\\;SET SCHEMA APP
spring.h2.console.enabled=false

# Primeiro ADMIN dos testes (no lugar das variáveis de ambiente)
APP_ADMIN_USER=admin
APP_ADMIN_PASSWORD=senha-de-teste-123

# Menos barulho no console
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
spring.output.ansi.enabled=NEVER
