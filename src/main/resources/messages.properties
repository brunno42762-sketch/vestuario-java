# Mensagens usadas pelo Spring na validação dos formulários.
# "typeMismatch" acontece quando o valor digitado não pode virar número
# (campo vazio ou com texto em um campo numérico).
typeMismatch=Informe um número válido.
typeMismatch.double=Informe um valor numérico válido.
typeMismatch.int=Informe um número inteiro válido.
