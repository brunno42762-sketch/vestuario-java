<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/base :: head('Meus pedidos')}"></head>
<body>
<th:block th:replace="~{fragments/navegacao :: loja('minha-conta')}"></th:block>

<main class="container" id="conteudo">
    <div class="cabecalho-pagina">
        <h2 class="titulo-cabecalho-cartao">Meus pedidos</h2>
    </div>

    <!-- Dados do cliente logado (vêm do cadastro ligado ao usuário) -->
    <section class="painel-grade conta-resumo" aria-label="Meu cadastro">
        <article class="painel-cartao">
            <h3 class="painel-titulo">Meu cadastro</h3>
            <p th:text="|${cliente.cidade} / ${cliente.estado}|">Porto Alegre / RS</p>
            <p th:text="|Faixa etária: ${cliente.faixaEtaria}|">Faixa etária: 45-54</p>
            <p th:text="${cliente.clienteFidelidade} ? 'Participa do programa de fidelidade' : 'Não participa do programa de fidelidade'">Fidelidade</p>
        </article>
        <article class="painel-cartao">
            <h3 class="painel-titulo">Entrega</h3>
            <p th:if="${cliente.entrega != null}" th:text="|${cliente.entrega.cidadeEntrega} / ${cliente.entrega.estadoEntrega}|">Porto Alegre / RS</p>
            <p th:if="${cliente.entrega == null}">Sem endereço de entrega cadastrado.</p>
        </article>
        <article class="painel-cartao">
            <h3 class="painel-titulo">Pedidos</h3>
            <p class="painel-numero" th:text="${pedidos.totalElements}">17</p>
            <p class="painel-legenda">no total</p>
        </article>
    </section>

    <div class="cartao-lista">
        <div class="tabela-rolavel">
            <table class="lista">
                <thead>
                    <tr>
                        <th scope="col">Pedido</th>
                        <th scope="col">Data</th>
                        <th scope="col">Canal</th>
                        <th scope="col">Pagamento</th>
                        <th scope="col">Valor</th>
                        <th scope="col">Status</th>
                        <th scope="col">Detalhes</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="pedido : ${pedidos.content}">
                        <td th:text="${pedido.idPedido}">1</td>
                        <td th:text="${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy')}">10/01/2026</td>
                        <td th:text="${pedido.canalVenda.nome}">E-commerce</td>
                        <td th:text="${pedido.formaPagamento.nome}">Pix</td>
                        <td th:text="|R$ ${#numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')}|">R$ 159,80</td>
                        <td>
                            <span class="status" th:classappend="|status-${pedido.statusPedido}|"
                                  th:text="${pedido.statusPedido.nome}">Concluído</span>
                        </td>
                        <td class="acoes">
                            <a class="action-btn" th:href="@{/minha-conta/pedidos/{id}(id=${pedido.idPedido})}">Ver</a>
                        </td>
                    </tr>
                    <tr th:if="${pedidos.totalElements == 0}">
                        <td colspan="7">Você ainda não tem pedidos.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav th:replace="~{fragments/paginacao :: paginacao(@{/minha-conta}, 'Páginas dos meus pedidos', '')}"></nav>
</main>
</body>
</html>
