<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/base :: head('Entrar')}"></head>
<body>
<th:block th:replace="~{fragments/navegacao :: loja('entrar')}"></th:block>

<main class="container" id="conteudo">
    <div class="cabecalho-pagina cabecalho-login">
        <h2 class="titulo-cabecalho-cartao">Entrar</h2>
    </div>

    <!-- O POST vai para /login, tratado pelo Spring Security. O th:action acrescenta o token CSRF. -->
    <form class="form-login" th:action="@{/login}" method="post">

        <div class="alerta alerta-erro" th:if="${param.error}" role="alert">Usuário ou senha inválidos.</div>
        <div class="alerta alerta-sucesso" th:if="${param.logout}" role="status">Sessão encerrada.</div>
        <div class="alerta alerta-aviso" th:if="${param.expired}" role="status">Sua sessão foi encerrada. Entre novamente.</div>
        <div class="alerta alerta-sucesso" th:if="${param.cadastro}" role="status">Conta criada! Entre com seu usuário e senha.</div>

        <fieldset>
            <legend>Acesse sua conta</legend>
            <div class="campos">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" autocomplete="username" required autofocus
                       th:value="${param.usuario}">

                <label for="password">Senha</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
        </fieldset>

        <div class="acoes-form">
            <button class="btn-criar" type="submit">Entrar</button>
            <a class="link-cancelar" th:href="@{/}">Voltar à loja</a>
        </div>

        <p class="login-cadastro">Ainda não tem conta? <a th:href="@{/cadastro}">Criar conta</a></p>
    </form>
</main>
</body>
</html>
