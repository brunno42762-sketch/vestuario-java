<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&family=Special+Gothic+Condensed+One&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/mensagens.css}">
</head>
<body>
<nav class="navbar sm:navbar-expand bg-1 fg-2">
  <div class="container-fluid">
    <a class="navbar-brand" th:href="@{/}">Vestuário</a>
  </div>
</nav>

<main class="container">
    <div class="cabecalho-pagina">
        <h2 class="titulo-cabecalho-cartao">Entrar</h2>
    </div>

    <!-- O POST vai para /login, tratado pelo Spring Security. O th:action acrescenta o token CSRF. -->
    <form class="form-login" th:action="@{/login}" method="post">

        <div class="alerta alerta-erro" th:if="${param.error}" role="alert">Usuário ou senha inválidos.</div>
        <div class="alerta alerta-sucesso" th:if="${param.logout}" role="status">Sessão encerrada.</div>
        <div class="alerta alerta-aviso" th:if="${param.expired}" role="status">Sua sessão foi encerrada. Entre novamente.</div>

        <fieldset>
            <legend>Acesse sua conta</legend>
            <div class="campos">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" autocomplete="username" required autofocus>

                <label for="password">Senha</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
        </fieldset>

        <div class="acoes-form">
            <button class="btn-criar" type="submit">Entrar</button>
            <a class="link-cancelar" th:href="@{/}">Voltar à loja</a>
        </div>
    </form>
</main>
</body>
</html>
