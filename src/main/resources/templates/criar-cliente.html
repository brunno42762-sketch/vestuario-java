<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/base :: head(${edicao} ? 'Editar cliente' : 'Novo cliente')}"></head>
<body>
<th:block th:replace="~{fragments/navegacao :: admin('clientes')}"></th:block>

<main class="container" id="conteudo">
    <div class="cabecalho-pagina">
        <h2 class="titulo-cabecalho-cartao"
            th:text="${edicao} ? |Editar cliente ${cliente.idCliente}| : 'Novo cliente'">Novo cliente</h2>

        <nav class="alternar-tipo" aria-label="Tipo de cadastro" th:unless="${edicao}">
            <a th:href="@{/admin/produtos/novo}">Produto</a>
            <a th:href="@{/admin/clientes/novo}" aria-current="page">Cliente</a>
        </nav>
    </div>

    <!-- Mesmo formulário para criar (POST /clientes) e editar (POST /clientes/{id}) -->
    <form th:object="${cliente}" method="post"
          th:action="${edicao} ? @{/admin/clientes/{id}(id=*{idCliente})} : @{/admin/clientes}"
          novalidate>

        <div class="alerta alerta-erro" th:if="${#fields.hasGlobalErrors()}">
            <p th:each="erro : ${#fields.globalErrors()}" th:text="${erro}">Erro</p>
        </div>

        <fieldset>
            <legend>Perfil</legend>
            <div class="campos">
                <label for="faixaEtaria">Faixa etária</label>
                <div>
                    <select id="faixaEtaria" th:field="*{faixaEtaria}" required>
                        <option value="">Selecione...</option>
                        <option th:each="f : ${faixasEtarias}" th:value="${f}" th:text="${f}">25-34</option>
                    </select>
                    <span class="erro-campo" th:if="${#fields.hasErrors('faixaEtaria')}" th:errors="*{faixaEtaria}"></span>
                </div>

                <label for="genero">Gênero</label>
                <div>
                    <select id="genero" th:field="*{genero}" required>
                        <option value="">Selecione...</option>
                        <option th:each="g : ${generos}" th:value="${g}" th:text="${g}">Feminino</option>
                    </select>
                    <span class="erro-campo" th:if="${#fields.hasErrors('genero')}" th:errors="*{genero}"></span>
                </div>

                <label for="canalPreferido">Canal preferido</label>
                <div>
                    <select id="canalPreferido" th:field="*{canalPreferido}" required>
                        <option value="">Selecione...</option>
                        <option th:each="c : ${canais}" th:value="${c}" th:text="${c.nome}">E-commerce</option>
                    </select>
                    <span class="erro-campo" th:if="${#fields.hasErrors('canalPreferido')}" th:errors="*{canalPreferido}"></span>
                </div>

                <label class="campo-checkbox">
                    <input type="checkbox" th:field="*{clienteFidelidade}">
                    Participa do programa de fidelidade
                </label>
            </div>
        </fieldset>

        <fieldset>
            <legend>Localização</legend>
            <div class="campos">
                <label for="cidade">Cidade</label>
                <div>
                    <input type="text" id="cidade" th:field="*{cidade}" maxlength="60" required>
                    <span class="erro-campo" th:if="${#fields.hasErrors('cidade')}" th:errors="*{cidade}"></span>
                </div>

                <label for="estado">Estado</label>
                <div>
                    <select id="estado" th:field="*{estado}" required>
                        <option value="">Selecione...</option>
                        <option th:each="uf : ${ufs}" th:value="${uf}" th:text="${uf}">SP</option>
                    </select>
                    <span class="erro-campo" th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}"></span>
                </div>
            </div>
        </fieldset>

        <!-- Campos da entidade Entrega (Cliente 1 ◆—— 1 Entrega) -->
        <fieldset>
            <legend>Entrega</legend>
            <div class="campos">
                <label for="cidadeEntrega">Cidade de entrega</label>
                <div>
                    <input type="text" id="cidadeEntrega" th:field="*{entrega.cidadeEntrega}" maxlength="60" required>
                    <span class="erro-campo" th:if="${#fields.hasErrors('entrega.cidadeEntrega')}" th:errors="*{entrega.cidadeEntrega}"></span>
                </div>

                <label for="estadoEntrega">Estado de entrega</label>
                <div>
                    <select id="estadoEntrega" th:field="*{entrega.estadoEntrega}" required>
                        <option value="">Selecione...</option>
                        <option th:each="uf : ${ufs}" th:value="${uf}" th:text="${uf}">SP</option>
                    </select>
                    <span class="erro-campo" th:if="${#fields.hasErrors('entrega.estadoEntrega')}" th:errors="*{entrega.estadoEntrega}"></span>
                </div>
            </div>
        </fieldset>

        <div class="acoes-form">
            <button class="btn-criar" type="submit" th:text="${edicao} ? 'Salvar' : 'Cadastrar'">Cadastrar</button>
            <a class="link-cancelar" th:href="@{/admin/clientes}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
