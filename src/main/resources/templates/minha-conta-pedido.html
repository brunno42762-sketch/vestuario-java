<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/base :: head('Pedido')}"></head>
<body>
<th:block th:replace="~{fragments/navegacao :: loja('minha-conta')}"></th:block>

<main class="container" id="conteudo">
    <div class="cabecalho-pagina">
        <h2 class="titulo-cabecalho-cartao" th:text="|Pedido ${pedido.idPedido}|">Pedido 1</h2>
        <a class="link-loja" th:href="@{/minha-conta}">Voltar aos meus pedidos</a>
    </div>

    <th:block th:replace="~{fragments/mensagens :: alertas}"></th:block>

    <section class="painel-grade conta-resumo" aria-label="Resumo do pedido">
        <article class="painel-cartao">
            <h3 class="painel-titulo">Situação</h3>
            <p>
                <span class="status" th:classappend="|status-${pedido.statusPedido}|"
                      th:text="${pedido.statusPedido.nome}">Entregue</span>
            </p>
            <p th:text="|Feito em ${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy')}|">Feito em 10/01/2026</p>
            <!-- Só pedidos ainda não entregues podem ser cancelados pelo cliente; as peças voltam ao estoque -->
            <form class="form-inline" method="post" th:if="${pedido.statusPedido.name() == 'CRIADO'}"
                  th:action="@{/minha-conta/pedidos/{id}/cancelar(id=${pedido.idPedido})}"
                  onsubmit="return confirm('Cancelar este pedido?')">
                <button type="submit" class="botao-secundario">Cancelar pedido</button>
            </form>
        </article>
        <article class="painel-cartao">
            <h3 class="painel-titulo">Pagamento</h3>
            <p th:text="${pedido.formaPagamento.nome}">Pix</p>
            <p th:text="|Canal: ${pedido.canalVenda.nome}|">Canal: E-commerce</p>
        </article>
        <article class="painel-cartao">
            <h3 class="painel-titulo">Total</h3>
            <p class="painel-numero total-pedido"
               th:text="|R$ ${#numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')}|">R$ 159,80</p>
            <p class="painel-legenda" th:if="${cliente.entrega != null}"
               th:text="|Entrega em ${cliente.entrega.cidadeEntrega} / ${cliente.entrega.estadoEntrega}|">Entrega em Porto Alegre / RS</p>
        </article>
    </section>

    <div class="cartao-lista">
        <table class="lista">
            <caption class="legenda-tabela">Itens do pedido</caption>
            <thead>
                <tr>
                    <th scope="col">Produto</th>
                    <th scope="col">Marca</th>
                    <th scope="col">Cor</th>
                    <th scope="col">Tamanho</th>
                    <th scope="col">Quantidade</th>
                    <th scope="col">Preço unitário</th>
                    <th scope="col">Desconto</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${pedido.itensPedido}">
                    <td th:text="|${item.produto.categoria} ${item.produto.subcategoria}|">Calça Jeans</td>
                    <td th:text="${item.produto.marca}">Linha Sul</td>
                    <td th:text="${item.produto.cor}">Azul</td>
                    <td th:text="${item.tamanho}">M</td>
                    <td th:text="${item.quantidade}">2</td>
                    <td th:text="|R$ ${#numbers.formatDecimal(item.precoUnitario, 1, 'POINT', 2, 'COMMA')}|">R$ 189,90</td>
                    <td th:text="${item.descontoPercentual > 0} ? |${#numbers.formatDecimal(item.descontoPercentual * 100, 1, 0)}%| : '—'">10%</td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
