<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/base :: head('Acesso negado')}"></head>
<body>
<th:block th:replace="~{fragments/navegacao :: loja('')}"></th:block>

<main class="container" id="conteudo">
    <div class="cabecalho-pagina">
        <h2 class="titulo-cabecalho-cartao">Acesso negado</h2>
    </div>

    <div class="cartao-lista cartao-erro">
        <p class="codigo-erro">403</p>
        <p sec:authorize="isAuthenticated()">
            Você está conectado como
            <strong sec:authentication="name">Vendedor</strong>
            (<span sec:authentication="principal.perfil.descricao">Vendedor</span>),
            e esse perfil não tem permissão para esta página ou operação.
        </p>
        <p sec:authorize="isAnonymous()">Você não tem permissão para esta página.</p>
        <p class="acoes-erro">
            <a class="botao-primario" sec:authorize="hasAnyRole('ADMIN', 'VENDEDOR')" th:href="@{/admin}">Voltar ao painel</a>
            <a class="botao-primario" sec:authorize="hasRole('CLIENTE')" th:href="@{/minha-conta}">Ir para meus pedidos</a>
            <a class="botao-secundario" th:href="@{/}">Ir para a loja</a>
        </p>
    </div>
</main>
</body>
</html>
