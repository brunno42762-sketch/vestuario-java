<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso negado</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&family=Special+Gothic+Condensed+One&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/mensagens.css}">
</head>
<body>
<nav class="navbar sm:navbar-expand bg-1 fg-2">
  <div class="container-fluid">
    <a class="navbar-brand" th:href="@{/}">Vestuário</a>
  </div>
</nav>

<main class="container">
    <div class="cabecalho-pagina">
        <h2 class="titulo-cabecalho-cartao">Acesso negado</h2>
    </div>

    <div class="cartao-lista cartao-erro">
        <p class="codigo-erro">403</p>
        <p sec:authorize="isAuthenticated()">
            Você está conectado como
            <strong sec:authentication="name">Vendedor</strong>
            (<span sec:authentication="principal.perfil.descricao">Vendedor</span>),
            e esse perfil não tem permissão para esta página ou operação.
        </p>
        <p sec:authorize="isAnonymous()">Você não tem permissão para esta página.</p>
        <p class="acoes-erro">
            <a class="botao-primario" sec:authorize="hasAnyRole('ADMIN', 'VENDEDOR')" th:href="@{/admin}">Voltar ao painel</a>
            <a class="botao-primario" sec:authorize="hasRole('CLIENTE')" th:href="@{/minha-conta}">Ir para meus pedidos</a>
            <a class="botao-secundario" th:href="@{/}">Ir para a loja</a>
        </p>
    </div>
</main>
</body>
</html>
