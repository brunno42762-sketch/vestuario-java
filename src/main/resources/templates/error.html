<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/base :: head(${status} + ' – ' + ${error})}"></head>
<body>
<th:block th:replace="~{fragments/navegacao :: loja('')}"></th:block>

<main class="container" id="conteudo">
    <div class="cabecalho-pagina">
        <h2 class="titulo-cabecalho-cartao" th:text="${status == 404} ? 'Página não encontrada' : 'Ocorreu um erro'">Erro</h2>
    </div>

    <div class="cartao-lista cartao-erro">
        <p class="codigo-erro" th:text="${status}">500</p>
        <p th:text="${status == 404} ? 'O endereço acessado não existe.' : 'Algo deu errado ao processar a requisição. Tente novamente.'">Erro.</p>
        <p><a class="action-btn" th:href="@{/admin}">Voltar para o painel</a></p>
    </div>
</main>
</body>
</html>
