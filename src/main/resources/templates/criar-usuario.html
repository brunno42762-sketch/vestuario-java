<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/base :: head(${usuario.id == null} ? 'Novo usuário' : 'Editar usuário')}"></head>
<body>
<th:block th:replace="~{fragments/navegacao :: admin('usuarios')}"></th:block>

<main class="container" id="conteudo">
    <div class="cabecalho-pagina">
        <h2 class="titulo-cabecalho-cartao"
            th:text="${usuario.id == null} ? 'Novo usuário' : |Editar usuário ${usuario.username}|">Novo usuário</h2>
    </div>

    <form method="post" th:action="@{/admin/usuarios/salvar}" th:object="${usuario}">
        <div class="alerta alerta-erro" role="alert" th:if="${erro}" th:text="${erro}">Erro.</div>

        <!-- id em branco = cadastro novo; preenchido = edição -->
        <input type="hidden" th:field="*{id}">

        <fieldset>
            <legend>Acesso</legend>
            <div class="campos">
                <label for="username">Usuário</label>
                <div>
                    <input type="text" id="username" th:field="*{username}" maxlength="80" autocomplete="off" required>
                    <span class="dica-campo">Nome usado para entrar no sistema.</span>
                </div>

                <label for="novaSenha" th:text="${usuario.id == null} ? 'Senha' : 'Nova senha'">Senha</label>
                <div>
                    <input type="password" id="novaSenha" name="novaSenha" autocomplete="new-password"
                           minlength="8" th:required="${usuario.id == null}">
                    <span class="dica-campo" th:if="${usuario.id == null}">Pelo menos 8 caracteres.</span>
                    <span class="dica-campo" th:if="${usuario.id != null}">Deixe em branco para manter a senha atual.</span>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Perfil</legend>
            <div class="campos">
                <label for="perfil">Perfil</label>
                <select id="perfil" th:field="*{perfil}" required>
                    <option value="">Selecione o perfil</option>
                    <option th:each="p : ${perfis}" th:value="${p.name()}" th:text="${p.descricao}">Vendedor</option>
                </select>

                <label for="idCliente">ID do cliente vinculado</label>
                <div>
                    <input type="number" id="idCliente" name="idCliente" min="1"
                           th:value="${usuario.cliente != null} ? ${usuario.cliente.idCliente} : ''">
                    <span class="dica-campo">Só para o perfil Cliente: o cadastro de cliente cujos pedidos este usuário vai ver.</span>
                </div>

                <label class="campo-checkbox">
                    <input type="checkbox" th:field="*{ativo}">
                    Conta ativa
                </label>
            </div>
        </fieldset>

        <div class="acoes-form">
            <button class="btn-criar" type="submit" th:text="${usuario.id == null} ? 'Cadastrar' : 'Salvar'">Salvar</button>
            <a class="link-cancelar" th:href="@{/admin/usuarios}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
