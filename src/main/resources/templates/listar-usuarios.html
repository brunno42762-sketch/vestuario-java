<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&family=Special+Gothic+Condensed+One&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/mensagens.css}">
</head>
<body>
<nav class="navbar sm:navbar-expand bg-1 fg-2">
  <div class="container-fluid">
    <a class="navbar-brand" th:href="@{/}">Vestuário</a>
    <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon" aria-hidden="true"></span>
    </button>
    <dialog class="drawer drawer-end" tabindex="-1" id="navbarNav" aria-labelledby="navbarNavLabel">
      <div class="drawer-header">
        <h5 class="drawer-title" id="navbarNavLabel">Menu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
      </div>
      <div class="drawer-body">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" th:href="@{/admin}">Painel</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/produtos}">Produtos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/clientes}">Clientes</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/pedidos}">Pedidos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" th:href="@{/admin/usuarios}">Usuários</a>
          </li>
          <li class="nav-item item-sair" sec:authorize="isAuthenticated()">
            <form class="form-sair" th:action="@{/logout}" method="post">
              <span class="usuario-logado" sec:authentication="name">admin</span>
              <button type="submit" class="botao-sair">Sair</button>
            </form>
          </li>
        </ul>
      </div>
    </dialog>
  </div>
</nav>

<main class="container">
    <div class="cabecalho-pagina">
        <h2 class="titulo-cabecalho-cartao">Usuários</h2>
        <a class="botao-primario" th:href="@{/admin/usuarios/novo}">Novo usuário</a>
    </div>

    <div class="alerta alerta-sucesso" role="status" th:if="${sucesso}" th:text="${sucesso}">Operação concluída.</div>
    <div class="alerta alerta-erro" role="alert" th:if="${erro}" th:text="${erro}">Não foi possível concluir.</div>

    <div class="cartao-lista">
        <table class="lista">
            <thead>
                <tr>
                    <th scope="col">Usuário</th>
                    <th scope="col">Perfil</th>
                    <th scope="col">Cliente vinculado</th>
                    <th scope="col">Situação</th>
                    <th scope="col">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.username}">admin</td>
                    <td th:text="${usuario.perfil.descricao}">Administrador</td>
                    <td th:text="${usuario.cliente != null} ? |${usuario.cliente.idCliente} – ${usuario.cliente.cidade}/${usuario.cliente.estado}| : '—'">—</td>
                    <td>
                        <span class="status status-ENTREGUE" th:if="${usuario.ativo}">Ativo</span>
                        <span class="status status-CANCELADO" th:unless="${usuario.ativo}">Inativo</span>
                    </td>
                    <td class="acoes">
                        <a class="action-btn" th:href="@{/admin/usuarios/{id}/editar(id=${usuario.id})}">Editar</a>
                        <form class="form-inline" method="post"
                              th:action="@{/admin/usuarios/{id}/excluir(id=${usuario.id})}"
                              onsubmit="return confirm('Deseja realmente excluir este usuário?')">
                            <button type="submit" class="action-btn botao-link">Excluir</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="5">Nenhum usuário cadastrado.</td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
