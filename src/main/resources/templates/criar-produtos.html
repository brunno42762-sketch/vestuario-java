<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/base :: head(${edicao} ? 'Editar produto' : 'Novo produto')}"></head>
<body>
<th:block th:replace="~{fragments/navegacao :: admin('produtos')}"></th:block>

<main class="container" id="conteudo">

    <div class="cabecalho-pagina">
        <h2 class="titulo-cabecalho-cartao"
            th:text="${edicao} ? |Editar produto ${produto.idProduto}| : 'Novo produto'">Novo produto</h2>

        <nav class="alternar-tipo" aria-label="Tipo de cadastro" th:unless="${edicao}">
            <a th:href="@{/admin/produtos/novo}" aria-current="page">Produto</a>
            <a th:href="@{/admin/clientes/novo}">Cliente</a>
        </nav>
    </div>

    <!-- Mesmo formulário para criar (POST /produtos) e editar (POST /produtos/{id}) -->
    <form th:object="${produto}" method="post"
          th:action="${edicao} ? @{/admin/produtos/{id}(id=*{idProduto})} : @{/admin/produtos}"
          novalidate>

        <!-- Erros que envolvem mais de um campo (ex.: preço menor que o custo) -->
        <div class="alerta alerta-erro" th:if="${#fields.hasGlobalErrors()}">
            <p th:each="erro : ${#fields.globalErrors()}" th:text="${erro}">Erro</p>
        </div>

        <fieldset>
            <legend>Identificação</legend>
            <div class="campos">

                <label for="categoria">Categoria</label>
                <div>
                    <input type="text" id="categoria" th:field="*{categoria}" maxlength="60" required>
                    <span class="erro-campo" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></span>
                </div>

                <label for="subcategoria">Subcategoria</label>
                <div>
                    <input type="text" id="subcategoria" th:field="*{subcategoria}" maxlength="60" required>
                    <span class="erro-campo" th:if="${#fields.hasErrors('subcategoria')}" th:errors="*{subcategoria}"></span>
                </div>

                <label for="genero">Gênero</label>
                <div>
                    <select id="genero" th:field="*{genero}" required>
                        <option value="">Selecione...</option>
                        <option th:each="g : ${generos}" th:value="${g}" th:text="${g}">Unissex</option>
                    </select>
                    <span class="erro-campo" th:if="${#fields.hasErrors('genero')}" th:errors="*{genero}"></span>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Aparência</legend>
            <div class="campos">
                <label for="cor">Cor</label>
                <div>
                    <input type="text" id="cor" th:field="*{cor}" maxlength="40" required>
                    <span class="erro-campo" th:if="${#fields.hasErrors('cor')}" th:errors="*{cor}"></span>
                </div>

                <label for="marca">Marca</label>
                <div>
                    <input type="text" id="marca" th:field="*{marca}" maxlength="60" required>
                    <span class="erro-campo" th:if="${#fields.hasErrors('marca')}" th:errors="*{marca}"></span>
                </div>

                <label for="colecao">Coleção</label>
                <div>
                    <input type="text" id="colecao" th:field="*{colecao}" maxlength="60">
                    <span class="erro-campo" th:if="${#fields.hasErrors('colecao')}" th:errors="*{colecao}"></span>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Preços</legend>
            <div class="campos">
                <label for="precoUnitario">Preço Unitário</label>
                <div>
                    <input type="number" step="0.01" min="0.01" id="precoUnitario" th:field="*{precoUnitario}" required>
                    <span class="erro-campo" th:if="${#fields.hasErrors('precoUnitario')}" th:errors="*{precoUnitario}"></span>
                </div>

                <label for="custoUnitario">Custo Unitário</label>
                <div>
                    <input type="number" step="0.01" min="0.01" id="custoUnitario" th:field="*{custoUnitario}" required>
                    <span class="erro-campo" th:if="${#fields.hasErrors('custoUnitario')}" th:errors="*{custoUnitario}"></span>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Estoque</legend>
            <div class="campos">
                <label for="estoqueAtual">Estoque Atual</label>
                <div>
                    <input type="number" step="1" min="0" id="estoqueAtual" th:field="*{estoqueAtual}" required>
                    <span class="erro-campo" th:if="${#fields.hasErrors('estoqueAtual')}" th:errors="*{estoqueAtual}"></span>
                </div>

                <label for="estoqueMinimo">Estoque Mínimo</label>
                <div>
                    <input type="number" step="1" min="0" id="estoqueMinimo" th:field="*{estoqueMinimo}" required>
                    <span class="erro-campo" th:if="${#fields.hasErrors('estoqueMinimo')}" th:errors="*{estoqueMinimo}"></span>
                </div>

                <label for="fornecedor">Fornecedor</label>
                <div>
                    <input type="text" id="fornecedor" th:field="*{fornecedor}" maxlength="80" required>
                    <span class="erro-campo" th:if="${#fields.hasErrors('fornecedor')}" th:errors="*{fornecedor}"></span>
                </div>

                <label for="tempoReposicaoDias">Tempo de Reposição (dias)</label>
                <div>
                    <input type="number" step="1" min="0" id="tempoReposicaoDias" th:field="*{tempoReposicaoDias}" required>
                    <span class="erro-campo" th:if="${#fields.hasErrors('tempoReposicaoDias')}" th:errors="*{tempoReposicaoDias}"></span>
                </div>
            </div>
        </fieldset>

        <div class="acoes-form">
            <button class="btn-criar" type="submit" th:text="${edicao} ? 'Salvar' : 'Criar'">Criar</button>
            <a class="link-cancelar" th:href="@{/admin/produtos}">Cancelar</a>
        </div>
    </form>

</main>
</body>
</html>
