<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/base :: head(${titulo})}"></head>
<body>
<th:block th:replace="~{fragments/navegacao :: loja('')}"></th:block>

<main class="container" id="conteudo">
    <div class="cabecalho-pagina">
        <h2 class="titulo-cabecalho-cartao" th:text="${titulo}">Não encontrado</h2>
    </div>

    <div class="cartao-lista cartao-erro">
        <p class="codigo-erro" th:text="${codigo}">404</p>
        <p th:text="${mensagem}">O registro procurado não existe.</p>
        <p><a class="action-btn" th:href="@{/admin}">Voltar para o painel</a></p>
    </div>
</main>
</body>
</html>
