<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vestuário</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&family=Special+Gothic+Condensed+One&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/mensagens.css}">
</head>
<body>
<nav class="navbar sm:navbar-expand bg-1 fg-2">
  <div class="container-fluid">
    <a class="navbar-brand" th:href="@{/}">Vestuário</a>
    <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon" aria-hidden="true"></span>
    </button>
    <dialog class="drawer drawer-end" tabindex="-1" id="navbarNav" aria-labelledby="navbarNavLabel">
      <div class="drawer-header">
        <h5 class="drawer-title" id="navbarNavLabel">Menu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
      </div>
      <div class="drawer-body">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" th:href="@{/admin}">Painel</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/produtos/novo}">Criar</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" th:href="@{/admin/produtos}">Listar</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/pedidos}">Pedidos</a>
          </li>
        </ul>
      </div>
    </dialog>
  </div>
</nav>

<main class="container">
    <div class="cabecalho-pagina">
        <h2 class="titulo-cabecalho-cartao">Lista de produtos</h2>

        <nav class="alternar-tipo" aria-label="Tipo de lista">
            <a th:href="@{/admin/produtos}" aria-current="page">Produto</a>
            <a th:href="@{/admin/clientes}">Cliente</a>
        </nav>
    </div>

    <!-- Mensagens enviadas pelo controller depois de criar, editar ou excluir -->
    <div class="alerta alerta-sucesso" th:if="${sucesso}" th:text="${sucesso}">Produto criado.</div>
    <div class="alerta alerta-erro" th:if="${erro}" th:text="${erro}">Erro</div>

    <div class="cartao-lista">
        <table class="lista">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Categoria</th>
                    <th scope="col">Subcategoria</th>
                    <th scope="col">Cor</th>
                    <th scope="col">Marca</th>
                    <th scope="col">Preço</th>
                    <th scope="col">Estoque</th>
                    <th scope="col">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="produto : ${produtos}">
                    <td th:text="${produto.idProduto}">1042</td>
                    <td th:text="${produto.categoria}">Camisetas</td>
                    <td th:text="${produto.subcategoria}">Manga curta</td>
                    <td th:text="${produto.cor}">Verde-musgo</td>
                    <td th:text="${produto.marca}">Linha Sul</td>
                    <td th:text="|R$ ${#numbers.formatDecimal(produto.precoUnitario, 1, 'POINT', 2, 'COMMA')}|">R$ 89,90</td>
                    <td>
                        <span th:text="${produto.estoqueAtual}">48</span>
                        <span class="selo-repor" th:if="${produto.abaixoDoEstoqueMinimo}">repor</span>
                    </td>
                    <td class="acoes">
                        <a class="action-btn" th:href="@{/admin/produtos/{id}/editar(id=${produto.idProduto})}">Editar</a>
                        <form class="form-inline" method="post"
                              th:action="@{/admin/produtos/{id}/excluir(id=${produto.idProduto})}"
                              onsubmit="return confirm('Excluir este produto?')">
                            <button type="submit" class="action-btn botao-link">Remover</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(produtos)}">
                    <td colspan="8">Nenhum produto cadastrado.</td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
