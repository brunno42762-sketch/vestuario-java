<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/base :: head('Pedidos')}"></head>
<body>
<th:block th:replace="~{fragments/navegacao :: admin('pedidos')}"></th:block>

<main class="container" id="conteudo">
    <div class="cabecalho-pagina">
        <h2 class="titulo-cabecalho-cartao">Pedidos</h2>
        <a class="botao-primario" th:href="@{/admin/vendas/nova}">Nova venda</a>
    </div>

    <th:block th:replace="~{fragments/mensagens :: alertas}"></th:block>

    <!-- Filtros (GET, RF08): /admin/pedidos?status=ENTREGUE&canal=FISICA&de=2026-01-01&ate=2026-03-31&cliente=103 -->
    <form class="filtro-lista filtro-pedidos" method="get" th:action="@{/admin/pedidos}">
        <div class="filtro-campo">
            <label for="filtro-status">Status</label>
            <select id="filtro-status" name="status">
                <option value="">Todos</option>
                <option th:each="s : ${todosStatus}" th:value="${s}" th:text="${s.nome}"
                        th:selected="${s == filtro.status}">Entregue</option>
            </select>
        </div>
        <div class="filtro-campo">
            <label for="filtro-canal">Canal</label>
            <select id="filtro-canal" name="canal">
                <option value="">Todos</option>
                <option th:each="c : ${canais}" th:value="${c}" th:text="${c.nome}"
                        th:selected="${c == filtro.canal}">Loja Física</option>
            </select>
        </div>
        <div class="filtro-campo">
            <label for="filtro-de">De</label>
            <input type="date" id="filtro-de" name="de" th:value="${filtro.de}">
        </div>
        <div class="filtro-campo">
            <label for="filtro-ate">Até</label>
            <input type="date" id="filtro-ate" name="ate" th:value="${filtro.ate}">
        </div>
        <div class="filtro-campo">
            <label for="filtro-cliente">Cliente (ID)</label>
            <input type="number" id="filtro-cliente" name="cliente" min="1" th:value="${filtro.idCliente}">
        </div>
        <div class="filtro-campo">
            <label for="filtro-ordem">Ordenar</label>
            <select id="filtro-ordem" name="ordem">
                <option th:each="o : ${ordens}" th:value="${o}" th:text="${o.nome}"
                        th:selected="${o.name() == ordem}">Mais recentes</option>
            </select>
        </div>
        <div class="filtro-botoes">
            <button type="submit">Filtrar</button>
            <a class="link-limpar" th:if="${filtroAtivo}" th:href="@{/admin/pedidos}">Limpar filtros</a>
        </div>
        <span class="filtro-total" th:if="${pedidos.totalElements > 0}"
              th:text="|Mostrando ${#numbers.formatInteger(pedidos.number * pedidos.size + 1, 1, 'POINT')}–${#numbers.formatInteger(pedidos.number * pedidos.size + pedidos.numberOfElements, 1, 'POINT')} de ${#numbers.formatInteger(pedidos.totalElements, 1, 'POINT')} pedidos|">
            Mostrando 1–20 de 5.999 pedidos
        </span>
    </form>

    <div class="cartao-lista">
        <table class="lista">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Data</th>
                    <th scope="col">Cliente</th>
                    <th scope="col">Canal</th>
                    <th scope="col">Pagamento</th>
                    <th scope="col">Valor</th>
                    <th scope="col">Status</th>
                    <th scope="col">Alterar status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="pedido : ${pedidos.content}">
                    <td th:text="${pedido.idPedido}">1</td>
                    <td th:text="${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy')}">10/01/2026</td>
                    <td th:text="|${pedido.cliente.idCliente} – ${pedido.cliente.cidade}/${pedido.cliente.estado}|">1 – São Paulo/SP</td>
                    <td th:text="${pedido.canalVenda.nome}">E-commerce</td>
                    <td th:text="${pedido.formaPagamento.nome}">Pix</td>
                    <td th:text="|R$ ${#numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')}|">R$ 159,80</td>
                    <td>
                        <span class="status" th:classappend="|status-${pedido.statusPedido}|"
                              th:text="${pedido.statusPedido.nome}">Concluído</span>
                    </td>
                    <td>
                        <!-- Mostra todos os status de propósito: o servidor é quem bloqueia os inválidos -->
                        <form class="form-status" method="post"
                              th:action="@{/admin/pedidos/{id}/status(id=${pedido.idPedido})}">
                            <label class="visually-hidden" th:for="|status-${pedido.idPedido}|">Novo status</label>
                            <select name="novoStatus" th:id="|status-${pedido.idPedido}|">
                                <option th:each="s : ${todosStatus}"
                                        th:value="${s}" th:text="${s.nome}"
                                        th:selected="${s == pedido.statusPedido}">Entregue</option>
                            </select>
                            <!-- Para voltar à mesma página, aos mesmos filtros e à mesma ordem depois de alterar -->
                            <input type="hidden" name="pagina" th:value="${paginaAtual}">
                            <input type="hidden" th:each="f : ${parametrosFiltro}" th:name="${f.key}" th:value="${f.value}">
                            <input type="hidden" name="ordem" th:value="${ordem}">
                            <button type="submit">Alterar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${pedidos.totalElements == 0}">
                    <td colspan="8" th:text="${filtroAtivo} ? 'Nenhum pedido com esses filtros.' : 'Nenhum pedido cadastrado.'">Nenhum pedido cadastrado.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <nav th:replace="~{fragments/paginacao :: paginacao(@{${basePaginacao}}, 'Páginas da lista de pedidos', '')}"></nav>
</main>
</body>
</html>
